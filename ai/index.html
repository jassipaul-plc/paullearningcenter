<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Learning | Paul Learning Center</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #24563a;
      color: #ffffff;
      display: grid;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      place-items: center;
    }

    main {
      max-width: 1040px;
      padding: 48px 24px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.5rem, 7vw, 5.3rem);
      line-height: 1;
      margin: 0 0 34px;
    }

    .tagline {
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      line-height: 1.3;
      margin: 0 0 46px;
    }

    .message {
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      font-weight: 600;
      line-height: 1.55;
      margin: 0 auto 50px;
      max-width: 980px;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .status,
    .back-link {
      align-items: center;
      border-radius: 999px;
      display: inline-flex;
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      font-weight: 700;
      justify-content: center;
      min-height: 74px;
      padding: 18px 38px;
      text-decoration: none;
    }

    .status {
      background: #ffffff;
      color: #2d6b48;
    }

    .back-link {
      border: 3px solid #ffffff;
      color: #ffffff;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 640px) {
      h1 {
        margin-bottom: 24px;
      }

      .tagline {
        margin-bottom: 28px;
      }

      .message {
        margin-bottom: 34px;
      }

      .status,
      .back-link {
        min-height: 62px;
        padding: 16px 26px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Learning</h1>
    <p class="tagline">The Future of Education Starts Here</p>
    <p class="message">
      We are building an innovative AI-powered learning platform designed to help
      students master Math, ELA, and future-ready skills with personalized guidance.
    </p>
    <div class="actions">
      <span class="status">&#128640;&nbsp;Launching Soon</span>
      <a class="back-link" href="../index.html">&larr;&nbsp;Back to Main Site</a>
    </div>
  </main>
</body>
</html>
