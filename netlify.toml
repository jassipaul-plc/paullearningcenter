[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  functions = "netlify/functions"
  port = 8888

# API routes -> serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Old .html URLs -> new clean URLs (SEO + bookmarks)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/programs.html"
  to = "/programs/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
